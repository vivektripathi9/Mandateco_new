<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Obsidian Luxury Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="50%" stop-color="#121318" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Ultra-Refined Liquid Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Subdued Matte Gold for Accents -->
    <linearGradient id="matteGold" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <!-- Sleek Gunmetal Metallic for Briefcase/Base Elements -->
    <linearGradient id="gunmetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Premium Glow Filters -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Deep Luxury Base -->
  <rect width="800" height="800" rx="180" fill="url(#obsidianBg)" />

  <!-- Subtle Geometric Architectural Lines (High-End Corporate Aesthetics) -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1.5">
    <circle cx="400" cy="400" r="320" fill="none" />
    <circle cx="400" cy="400" r="240" fill="none" />
    <circle cx="400" cy="400" r="160" fill="none" />
    <line x1="400" y1="40" x2="400" y2="760" />
    <line x1="40" y1="400" x2="760" y2="400" />
  </g>

  <!-- Main Central Icon Composition -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">

    <!-- Luxury Growth Chart Pillars (Background Layer) -->
    <g transform="translate(150, 280)" opacity="0.85">
      <!-- Pillar 1 -->
      <rect x="0" y="160" width="75" height="180" rx="16" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="1.5" stroke-opacity="0.3" />
      <!-- Pillar 2 -->
      <rect x="105" y="90" width="75" height="250" rx="16" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="1.5" stroke-opacity="0.5" />
      <!-- Pillar 3 (Peak) -->
      <rect x="210" y="0" width="75" height="340" rx="16" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="2" stroke-opacity="0.8" />
      
      <!-- Subtle internal vertical brushed texture lines -->
      <line x1="37" y1="180" x2="37" y2="320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
      <line x1="142" y1="110" x2="142" y2="320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
      <line x1="247" y1="20" x2="247" y2="320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </g>

    <!-- Ascending Luxury Trajectory Line (Gold Vector) -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 188 410 L 293 330 L 398 210 L 515 110" stroke="url(#champagneGold)" stroke-width="8" filter="url(#luxuryGlow)" />
      <path d="M 188 410 L 293 330 L 398 210 L 515 110" stroke="#ffffff" stroke-width="3" />
      
      <!-- Milestone Nodes -->
      <circle cx="188" cy="410" r="8" fill="#18181b" stroke="url(#champagneGold)" stroke-width="4" />
      <circle cx="293" cy="330" r="8" fill="#18181b" stroke="url(#champagneGold)" stroke-width="4" />
      <circle cx="398" cy="210" r="8" fill="#18181b" stroke="url(#champagneGold)" stroke-width="4" />
      <circle cx="515" cy="110" r="14" fill="url(#champagneGold)" />
      <!-- Inner Diamond highlight in peak node -->
      <rect x="511" y="106" width="8" height="8" transform="rotate(45 515 110)" fill="#0a0b0e" />
    </g>

    <!-- Executive Briefcase Core Symbol (Crafted with Luxury Metallic Details) -->
    <g transform="translate(230, 410)" filter="url(#dropShadow)">
      <!-- Main Case Body -->
      <rect x="0" y="60" width="340" height="210" rx="28" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="3" />
      
      <!-- Inner Frame Accent Line -->
      <rect x="16" y="76" width="308" height="178" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

      <!-- Premium Gold Central Lock Mechanism -->
      <g transform="translate(138, 75)">
        <rect x="0" y="0" width="64" height="48" rx="10" fill="url(#champagneGold)" />
        <rect x="12" y="12" width="40" height="24" rx="6" fill="#18181b" />
        <circle cx="32" cy="24" r="6" fill="url(#champagneGold)" />
      </g>

      <!-- Luxurious Ergonomic Handle -->
      <path d="M 105 60 C 105 10, 235 10, 235 60" fill="none" stroke="url(#champagneGold)" stroke-width="12" stroke-linecap="round" />
      <path d="M 113 58 C 113 22, 227 22, 227 58" fill="none" stroke="#0a0b0e" stroke-width="4" stroke-linecap="round" />

      <!-- Minimalist Gold Corner Brackets -->
      <path d="M 0 96 L 0 72 C 0 52, 20 32, 40 32 L 56 32" fill="none" stroke="url(#champagneGold)" stroke-width="5" stroke-linecap="round" />
      <path d="M 340 96 L 340 72 C 340 52, 320 32, 300 32 L 284 32" fill="none" stroke="url(#champagneGold)" stroke-width="5" stroke-linecap="round" />
    </g>

    <!-- Minimalist Executive Target & Trajectory Arrow (Top Right Accent) -->
    <g transform="translate(565, 185)">
      <!-- Target Rings -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#champagneGold)" stroke-width="2" opacity="0.3" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#champagneGold)" stroke-width="3" opacity="0.6" />
      <circle cx="0" cy="0" r="20" fill="url(#champagneGold)" />
      
      <!-- Hitting Arrow -->
      <path d="M -75 75 L -18 18" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" />
      <polygon points="-3,3 -24,18 -12,-6" fill="url(#champagneGold)" />
    </g>

    <!-- Refined Diamond Sparkles / High-End Accents -->
    <g fill="url(#champagneGold)">
      <!-- Top Left Diamond Sparkle -->
      <path d="M 140 180 Q 140 150 110 150 Q 140 150 140 120 Q 140 150 170 150 Q 140 150 140 180 Z" />
      <!-- Right Side Minimalist Accent Star -->
      <path d="M 640 340 Q 640 320 620 320 Q 640 320 640 300 Q 640 320 660 320 Q 640 320 640 340 Z" transform="scale(0.75) translate(140, 60)" opacity="0.8" />
    </g>

  </g>
</svg>
