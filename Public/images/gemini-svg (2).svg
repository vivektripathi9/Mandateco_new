<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Rich Obsidian Luxury Background -->
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0e" />
      <stop offset="50%" stop-color="#121318" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Ultra-Refined Liquid Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#ca8a04" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <!-- Sleek Gunmetal Metallic for Core Elements -->
    <linearGradient id="gunmetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Premium Glow Filters -->
    <filter id="luxuryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Deep Luxury Base -->
  <rect width="800" height="800" rx="180" fill="url(#obsidianBg)" />

  <!-- Subtle Geometric Architectural Lines (Operations Grid & Flow) -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1.5">
    <circle cx="400" cy="400" r="320" fill="none" />
    <circle cx="400" cy="400" r="240" fill="none" />
    <circle cx="400" cy="400" r="160" fill="none" />
    <line x1="400" y1="40" x2="400" y2="760" />
    <line x1="40" y1="400" x2="760" y2="400" />
    <!-- Additional Process Flow Lines -->
    <line x1="220" y1="40" x2="220" y2="760" opacity="0.5" />
    <line x1="580" y1="40" x2="580" y2="760" opacity="0.5" />
  </g>

  <!-- Main Central Icon Composition -->
  <g filter="url(#dropShadow)" transform="translate(0, 10)">

    <!-- Industrial Precision Gears & Workflow (Background Layer) -->
    <g transform="translate(120, 260)" opacity="0.9">
      <!-- Large Gear Left -->
      <g transform="translate(0, 80)">
        <circle cx="80" cy="80" r="70" fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-opacity="0.4" />
        <circle cx="80" cy="80" r="25" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="2" />
        <!-- Teeth -->
        <path d="M 80 0 L 90 15 L 70 15 Z" fill="url(#champagneGold)" transform="rotate(0 80 80)" opacity="0.5"/>
        <path d="M 160 80 L 145 70 L 145 90 Z" fill="url(#champagneGold)" transform="rotate(0 80 80)" opacity="0.5"/>
        <path d="M 80 160 L 70 145 L 90 145 Z" fill="url(#champagneGold)" transform="rotate(0 80 80)" opacity="0.5"/>
        <path d="M 0 80 L 15 90 L 15 70 Z" fill="url(#champagneGold)" transform="rotate(0 80 80)" opacity="0.5"/>
        <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="20s" repeatCount="indefinite"/>
      </g>

      <!-- Medium Gear Center-Top -->
      <g transform="translate(170, 0)">
        <circle cx="60" cy="60" r="50" fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-opacity="0.6" />
        <circle cx="60" cy="60" r="18" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="2" />
        <!-- Teeth -->
        <path d="M 60 0 L 68 12 L 52 12 Z" fill="url(#champagneGold)" opacity="0.7"/>
        <path d="M 120 60 L 108 52 L 108 68 Z" fill="url(#champagneGold)" opacity="0.7"/>
        <path d="M 60 120 L 52 108 L 68 108 Z" fill="url(#champagneGold)" opacity="0.7"/>
        <path d="M 0 60 L 12 68 L 12 52 Z" fill="url(#champagneGold)" opacity="0.7"/>
        <animateTransform attributeName="transform" type="rotate" from="360 60 60" to="0 60 60" dur="15s" repeatCount="indefinite"/>
      </g>

      <!-- Small Gear Right -->
      <g transform="translate(330, 120)">
        <circle cx="40" cy="40" r="35" fill="none" stroke="url(#champagneGold)" stroke-width="3" stroke-opacity="0.8" />
        <circle cx="40" cy="40" r="12" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="2" />
        <!-- Teeth -->
        <path d="M 40 0 L 46 9 L 34 9 Z" fill="url(#champagneGold)" opacity="0.9"/>
        <path d="M 80 40 L 71 34 L 71 46 Z" fill="url(#champagneGold)" opacity="0.9"/>
        <path d="M 40 80 L 34 71 L 46 71 Z" fill="url(#champagneGold)" opacity="0.9"/>
        <path d="M 0 40 L 9 46 L 9 34 Z" fill="url(#champagneGold)" opacity="0.9"/>
        <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="10s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Core Operations Command Center / Control Panel -->
    <g transform="translate(230, 400)" filter="url(#dropShadow)">
      <!-- Main Console Base -->
      <rect x="0" y="40" width="340" height="200" rx="28" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="3.5" />
      
      <!-- Inner Screen Area -->
      <rect x="24" y="64" width="292" height="152" rx="14" fill="#0a0b0e" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />

      <!-- Efficiency Graph / Bar Chart (Green/Gold -> Success/Precision) -->
      <g transform="translate(50, 100)">
        <!-- Bars -->
        <rect x="0" y="80" width="30" height="20" rx="4" fill="url(#champagneGold)" opacity="0.5" />
        <rect x="50" y="60" width="30" height="40" rx="4" fill="url(#champagneGold)" opacity="0.7" />
        <rect x="100" y="30" width="30" height="70" rx="4" fill="url(#champagneGold)" opacity="0.9" />
        <rect x="150" y="50" width="30" height="50" rx="4" fill="url(#champagneGold)" opacity="0.8" />
        <rect x="200" y="10" width="30" height="90" rx="4" fill="url(#champagneGold)" />
        
        <!-- Trend Line -->
        <polyline points="15 90 65 70 115 40 165 60 215 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#luxuryGlow)" />
        <polyline points="15 90 65 70 115 40 165 60 215 20" fill="none" stroke="url(#champagneGold)" stroke-width="6" stroke-linecap="round" />
      </g>

      <!-- Control Knob / Dial -->
      <g transform="translate(260, 140)">
        <circle cx="0" cy="0" r="30" fill="url(#gunmetal)" stroke="url(#champagneGold)" stroke-width="3" />
        <circle cx="0" cy="0" r="15" fill="#0a0b0e" />
        <line x1="0" y1="-22" x2="0" y2="-8" stroke="url(#champagneGold)" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Precision Target & Optimization Arrow (Top Right Accent) -->
    <g transform="translate(585, 175)">
      <!-- Target Rings -->
      <circle cx="0" cy="0" r="70" fill="none" stroke="url(#champagneGold)" stroke-width="2" opacity="0.3" />
      <circle cx="0" cy="0" r="45" fill="none" stroke="url(#champagneGold)" stroke-width="3" opacity="0.6" />
      <circle cx="0" cy="0" r="20" fill="url(#champagneGold)" />
      
      <!-- Optimized Path Arrow -->
      <path d="M -75 75 L -18 18" stroke="url(#champagneGold)" stroke-width="8" stroke-linecap="round" />
      <polygon points="-3,3 -24,18 -12,-6" fill="url(#champagneGold)" />
    </g>

    <!-- Refined Diamond Sparkles / Workflow Success Accents -->
    <g fill="url(#champagneGold)">
      <path d="M 140 180 Q 140 150 110 150 Q 140 150 140 120 Q 140 150 170 150 Q 140 150 140 180 Z" />
      <path d="M 660 350 Q 660 330 640 330 Q 660 330 660 310 Q 660 330 680 330 Q 660 330 660 350 Z" transform="scale(0.7) translate(180, 70)" opacity="0.8" />
    </g>

  </g>
</svg>
